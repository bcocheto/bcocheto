name: Metrics

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # Linguagens: inclui repositórios privados (exige o secret METRICS_TOKEN)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: bcocheto
          template: classic
          base: ""
          filename: metrics/languages.svg
          config_timezone: America/Sao_Paulo
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_indepth: yes
          plugin_languages_limit: 8
          plugin_languages_ignored: >
            html, css, scss, blade, shell, makefile, dockerfile, ejs, jupyter notebook
          plugin_languages_skipped: >
            bcocheto/bcocheto

      # Visão geral: commits, issues, PRs, revisões e contribuições (públicas e privadas)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: bcocheto
          template: classic
          base: header, activity, community
          filename: metrics/overview.svg
          config_timezone: America/Sao_Paulo
          config_display: regular
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_filter: issue, pr, release, push
          commits_authoring: bcocheto
